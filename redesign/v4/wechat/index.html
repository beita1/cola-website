<!doctype html>
<html lang="zh-CN">
  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>添加 Cola 客服微信</title>
    <meta name="description" content="扫描企业微信二维码，添加 Cola 官方客服。" />
    
    <link rel="icon" type="image/png" sizes="32x32" href="/cola-website/redesign/v4/favicon-32x32.png" />
    <script type="module" crossorigin src="/cola-website/redesign/v4/assets/wechat-B6AlnA1n.js"></script>
    <link rel="modulepreload" crossorigin href="/cola-website/redesign/v4/assets/sentry-UPn_sU5S.js">
    <link rel="modulepreload" crossorigin href="/cola-website/redesign/v4/assets/preload-helper-BXlSSEeF.js">
    <link rel="modulepreload" crossorigin href="/cola-website/redesign/v4/assets/analytics-DK2PBXev.js">
    <link rel="modulepreload" crossorigin href="/cola-website/redesign/v4/assets/wechat-support-EoWrqu0N.js">
    <link rel="stylesheet" crossorigin href="/cola-website/redesign/v4/assets/wechat-BT9WHXdM.css">
  <meta name="robots" content="noindex, nofollow" />
</head>
  <body>
    <main class="contact-page">
      <a class="brand" href="/cola-website/redesign/v4/" aria-label="Cola">
        <img src="/cola-website/redesign/v4/favicon-32x32.png" width="28" height="28" alt="" />
        <span>Cola</span>
      </a>
      <section class="contact-card" aria-labelledby="contact-title">
        <p class="eyebrow" data-copy="eyebrow">Cola 官方客服 · 企业微信</p>
        <h1 id="contact-title" data-copy="title">加个微信，慢慢聊</h1>
        <p class="intro" data-copy="intro">
          小 co 把客服入口放这儿。使用或订阅遇到问题，可以找我们聊聊。
        </p>
        <img
          class="contact-qr"
          id="contact-qr"
          src="/cola-website/redesign/v4/customer-service-qr.png"
          width="550"
          height="550"
          alt="Cola 官方客服企业微信二维码"
        />
        <a
          class="save-link"
          href="/cola-website/redesign/v4/customer-service-qr.png"
          download="cola-wechat.png"
          data-copy="save"
          >保存二维码</a
        >
        <p class="instructions" data-copy="instructions">
          长按图片也可保存。打开微信「扫一扫」，从相册选取二维码，按提示添加。
        </p>
        <p class="desktop-hint" data-copy="desktopHint">电脑访问时，直接用微信扫码。</p>
      </section>
    </main>
  </body>
</html>
